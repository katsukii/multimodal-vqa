# Best-known setup (the 0.574 model: ViT + BERT + cross-attention + soft, single LR — NO diff-LR,
# which regressed 3x) rerun with the review correctness fixes now in the code: ViT gets its own
# (0.5,0.5,0.5) normalization, validation uses a deterministic transform, and no horizontal flip.
# This isolates the ViT-normalization fix on the known-good config.
name: vit_bert_plain

data:
  root: data
  image_size: 224
  num_workers: 2
  answer_vocab_size: null
  val_fraction: 0.1
  max_qlen: 32
  augment: true

model:
  image_encoder:
    type: vit
    pretrained: true
    freeze: false
  text_encoder:
    type: bert
    name: bert-base-uncased
    freeze: false
  fusion:
    type: cross_attention
    hidden_dim: 768

train:
  epochs: 5
  batch_size: 12
  lr: 2.0e-5          # single LR (no head_lr / grad_clip — diff-LR regressed)
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 400
  amp: true
  soft_label: true
  seed: 42

output_dir: experiments/vit_bert_plain
backup_dir: /content/drive/MyDrive/matsuo-dl/final/vqa_ckpts

# Improved model (Run 2/3): pretrained ViT + BERT encoders, cross-modal attention, soft labels.
# The cross-attention fusion is the report centerpiece; toggling fusion/encoder/label gives the
# ablation table.
name: vit_bert_attn

data:
  root: data
  image_size: 224
  num_workers: 2
  answer_vocab_size: null   # full answer vocabulary (no catch-all <unk> class)
  val_fraction: 0.1
  max_qlen: 32
  augment: true

model:
  image_encoder:
    type: vit
    pretrained: true
    freeze: false            # fine-tune
  text_encoder:
    type: bert
    name: bert-base-uncased
    freeze: false
  fusion:
    type: cross_attention
    hidden_dim: 768

train:
  epochs: 5               # val plateaus early; keeps the ViT+BERT run within a Colab session
  batch_size: 12          # ViT-base + BERT-base both fine-tuned; fits a 16GB T4 with AMP (drop to 8 on OOM)
  lr: 2.0e-5              # low LR for the pretrained ViT/BERT encoders
  head_lr: 5.0e-4        # higher LR for the fresh fusion + classifier head (lectures 9/10)
  grad_clip: 1.0         # gradient clipping (course fine-tuning default)
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 400
  amp: true
  soft_label: true
  seed: 42

output_dir: experiments/vit_bert_attn
# Off-runtime checkpoint backup for long runs; on Colab this survives a disconnect.
backup_dir: /content/drive/MyDrive/matsuo-dl/final/vqa_ckpts

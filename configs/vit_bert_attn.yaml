# Improved model (Run 2/3): pretrained ViT + BERT encoders, cross-modal attention, soft labels.
# The cross-attention fusion is the report centerpiece; toggling fusion/encoder/label gives the
# ablation table.
name: vit_bert_attn

data:
  root: data
  image_size: 224
  num_workers: 2
  answer_vocab_size: null   # full answer vocabulary (no catch-all <unk> class)
  val_fraction: 0.1
  max_qlen: 32
  augment: true

model:
  image_encoder:
    type: vit
    pretrained: true
    freeze: false            # fine-tune
  text_encoder:
    type: bert
    name: bert-base-uncased
    freeze: false
  fusion:
    type: cross_attention
    hidden_dim: 768

train:
  epochs: 10
  batch_size: 32
  lr: 2.0e-5
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 500
  amp: true
  soft_label: true
  seed: 42

output_dir: experiments/vit_bert_attn

# Baseline experiment (mirrors the provided weak baseline for a fair starting point).
name: baseline

data:
  root: data/vizwiz
  image_size: 224
  num_workers: 4
  # Restrict the answer vocabulary to the top-N most frequent answers.
  answer_vocab_size: 3000

model:
  image_encoder:
    type: resnet18      # resnet18 | resnet50 | vit | convnext
    pretrained: false   # baseline trains from scratch
    freeze: false
  text_encoder:
    type: onehot        # onehot | gru | bert
  fusion:
    type: concat        # concat | cross_attention
    hidden_dim: 1024

train:
  epochs: 4
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 0.0
  optimizer: adam       # adam | adamw
  scheduler: none       # none | cosine
  warmup_steps: 0
  amp: false
  soft_label: false     # use the annotator answer distribution as soft targets
  seed: 42

output_dir: experiments/baseline
